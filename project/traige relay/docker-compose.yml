services:
  db:
    image: postgis/postgis:16-3.4
    container_name: triage-relay-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-triage_relay}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./dataset/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./dataset/seed_data.sql:/docker-entrypoint-initdb.d/02-seed_data.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-triage_relay}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
